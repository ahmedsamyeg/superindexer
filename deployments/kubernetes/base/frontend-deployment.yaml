apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-frontend
  namespace: indexer
  labels:
    app: indexer-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: indexer-frontend
  template:
    metadata:
      labels:
        app: indexer-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/superindexer/indexer-frontend:latest
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: indexer-frontend
  namespace: indexer
  labels:
    app: indexer-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: indexer-frontend
