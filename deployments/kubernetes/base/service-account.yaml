apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
  namespace: indexer
  labels:
    app.kubernetes.io/component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: indexer-role
  namespace: indexer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: indexer-role-binding
  namespace: indexer
subjects:
  - kind: ServiceAccount
    name: indexer
    namespace: indexer
roleRef:
  kind: Role
  name: indexer-role
  apiGroup: rbac.authorization.k8s.io
