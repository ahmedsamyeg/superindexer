apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-api
  namespace: indexer
  labels:
    app: indexer-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: indexer-api
  template:
    metadata:
      labels:
        app: indexer-api
    spec:
      serviceAccountName: indexer
      containers:
        - name: api
          image: ghcr.io/superindexer/indexer-api:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: indexer-config
            - secretRef:
                name: indexer-secrets
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: indexer-secrets
                  key: database-dsn
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: indexer-secrets
                  key: jwt-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: indexer-secrets
                  key: session-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: indexer-api
  namespace: indexer
  labels:
    app: indexer-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: indexer-api
