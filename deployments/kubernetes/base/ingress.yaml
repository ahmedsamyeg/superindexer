apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: indexer-ingress
  namespace: indexer
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - indexer.example.com
      secretName: indexer-tls
  rules:
    - host: indexer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: indexer-frontend
                port:
                  number: 80
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: indexer-api
                port:
                  number: 8080
