apiVersion: v1
kind: Secret
metadata:
  name: indexer-secrets
  namespace: indexer
type: Opaque
stringData:
  # These should be replaced with actual secrets in production
  database-dsn: "postgres://indexer:indexer@postgres:5432/indexer?sslmode=disable"
  jwt-secret: "change-me-in-production"
  session-secret: "change-me-in-production"
