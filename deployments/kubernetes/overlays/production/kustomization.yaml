apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: indexer

patches:
  - target:
      kind: Deployment
      name: indexer-api
    path: replicas.yaml
  - target:
      kind: Deployment
      name: indexer-api
    path: resources.yaml
  - target:
      kind: Deployment
      name: indexer-worker
    path: replicas.yaml
  - target:
      kind: Deployment
      name: indexer-worker
    path: resources.yaml
  - target:
      kind: Deployment
      name: indexer-frontend
    path: replicas.yaml
  - target:
      kind: Deployment
      name: indexer-frontend
    path: resources.yaml
