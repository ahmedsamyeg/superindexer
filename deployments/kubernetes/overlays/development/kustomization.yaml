apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: indexer-dev

patches:
  - target:
      kind: Deployment
      name: indexer-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: indexer-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: indexer-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
