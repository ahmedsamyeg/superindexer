global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'indexer-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'indexer-api'

  - job_name: 'indexer-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8080']
        labels:
          service: 'indexer-worker'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
